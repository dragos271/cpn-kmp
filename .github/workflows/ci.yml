name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Each host runs JVM, JS and Wasm tests plus the native tests for its own OS.
        include:
          - os: ubuntu-latest
            native: LinuxX64
            native-dir: linuxX64
            exe: cpn.kexe
          - os: macos-latest
            native: MacosArm64
            native-dir: macosArm64
            exe: cpn.kexe
          - os: windows-latest
            native: MingwX64
            native-dir: mingwX64
            exe: cpn.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew ktlintCheck
      - name: Test
        run: ./gradlew allTests --continue
      - name: Build CLI (native and JVM)
        run: ./gradlew :cpn-cli:linkReleaseExecutable${{ matrix.native }} :cpn-cli:installJvmDist
      - name: CLI smoke test (native)
        shell: bash
        run: |
          cpn=cpn-cli/build/bin/${{ matrix.native-dir }}/releaseExecutable/${{ matrix.exe }}
          "$cpn" --version
          "$cpn" simulate examples/simple-protocol.json --seed 2026 -n 25 | tee native.txt
          grep -q "Stopped after 25 steps" native.txt
      - name: Native and JVM CLI give the same run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cpn-cli/build/install/cpn-jvm/bin/cpn simulate examples/simple-protocol.json --seed 2026 -n 500 --format json > jvm.json
          cpn-cli/build/bin/${{ matrix.native-dir }}/releaseExecutable/${{ matrix.exe }} simulate examples/simple-protocol.json --seed 2026 -n 500 --format json > native.json
          diff jvm.json native.json
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
